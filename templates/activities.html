<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課外活動</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f4f4f4;
color: #333;
margin: 0;
padding: 0;
}
header {
background-color: #4CAF50;
color: white;
padding: 15px;
text-align: center;
}
section {
max-width: 800px;
margin: 20px auto;
padding: 0 15px;
}
.form-box {
background-color: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
margin-bottom: 20px;
}
/* 活動照片展覽區塊 */
.photo-gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 15px;
margin-top: 15px;
}
.photo-item {
background-color: #fafafa;
border: 1px solid #ddd;
border-radius: 8px;
overflow: hidden;
text-align: center;
}
.photo-item img {
width: 100%;
height: 200px;
object-fit: cover;
display: block;
}
.photo-item p {
margin: 8px 0;
font-size: 14px;
color: #555;
}
/* QR Code 顯示區塊 */
.qr-box {
margin-top: 20px;
text-align: center;
border-top: 1px dashed #ccc;
padding-top: 15px;
}
.qr-box img {
max-width: 130px;
width: 100%;
height: auto;
border-radius: 8px;
}
</style>
</head>
<body>
<header>
<h1>🌟 課外活動記錄</h1>
</header>
<section>
<!-- 活動照片展示 -->
<div class="form-box">
<h3>🏀 籃球賽事與社團活動照片</h3>
<div class="photo-gallery">
<div class="photo-item">
<img src="{{ url_for('static', filename='images/basketball-players-big-professional-arena-game.jpg') }}" alt="籃球比賽">
<p>校際籃球錦標賽精彩瞬間</p>
</div>
<div class="photo-item">
<img src="{{ url_for('static', filename='images/friends-enjoying-their-life-offline (1).jpg') }}" alt="籃球練習">
<p>戶外籃球練習與交流</p>
</div>
</div>
</div>

<!-- 問答與互動區塊 -->
<div class="form-box">
<h3>💬 提問與交流</h3>
<form action="/activities" method="post">
<label for="question">你的問題:</label><br>
<input type="text" id="question" name="question" value="{{ question }}" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"><br><br>
<label for="answer">答案:</label><br>
<input type="text" id="answer" name="answer" readonly value="{{ answer }}" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"><br><br>
<input type="submit" value="送出" style="padding: 8px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
<input type="button" value="回首頁" onclick="window.location.href='/'" style="padding: 8px 15px; background-color: #888; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px;">
</form>

<!-- QR Code 顯示區塊 -->
<div class="qr-box">
<p style="font-size: 14px; color: #666; margin-bottom: 5px;">掃描 QR Code 造訪本站：</p>
<img src="{{ url_for('static', filename='images/qr_code.jpg') }}" alt="QR Code">
</div>
</div>
</section>
</body>
</html>
